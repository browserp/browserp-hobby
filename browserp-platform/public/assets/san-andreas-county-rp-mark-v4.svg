<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">San Andreas County Roleplay showcase logo</title>
  <desc id="desc">An original county-style shield with an SA monogram, mountain horizon and road.</desc>
  <defs>
    <linearGradient id="shield" x1="32" y1="18" x2="170" y2="184" gradientUnits="userSpaceOnUse"><stop stop-color="#321137"/><stop offset=".48" stop-color="#140d1b"/><stop offset="1" stop-color="#06070a"/></linearGradient>
    <linearGradient id="edge" x1="30" y1="24" x2="170" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#ff74bd"/><stop offset=".52" stop-color="#b477ff"/><stop offset="1" stop-color="#66daf7"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M100 7 180 36v58c0 48-29 82-80 100-51-18-80-52-80-100V36Z" fill="url(#shield)" stroke="url(#edge)" stroke-width="7"/>
  <path d="m38 107 33-35 20 20 20-30 50 50" fill="none" stroke="#70617e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  <path d="M101 176c-9-29-7-49 7-72" fill="none" stroke="#f6eaf4" stroke-width="10" stroke-linecap="round"/>
  <path d="M103 176c-2-22 2-44 13-66" fill="none" stroke="#09080c" stroke-width="4" stroke-dasharray="8 9"/>
  <text x="100" y="70" text-anchor="middle" fill="#fff6fb" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" letter-spacing="-3" filter="url(#glow)">SA</text>
  <path d="M57 128h86" stroke="url(#edge)" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="147" text-anchor="middle" fill="#ff9dd0" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="2">COUNTY RP</text>
</svg>
